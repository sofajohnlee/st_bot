<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>등기정보광장 AI 안내봇</title>
  <meta name="description" content="대한민국 법원 등기정보광장 공개자료 안내봇">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#172033}.app{max-width:900px;margin:0 auto;padding:32px 18px}.hero{background:#163b68;color:white;border-radius:24px;padding:32px;margin-bottom:18px}.badge{font-size:14px;opacity:.9}.hero h1{font-size:36px;line-height:1.15;margin:14px 0 10px}.hero h1 span{font-weight:800}.hero p{margin:0;opacity:.9}.chat{background:white;border-radius:24px;padding:20px;box-shadow:0 8px 30px rgba(20,40,70,.08)}.messages{min-height:330px;max-height:520px;overflow:auto;padding:8px}.message{display:flex;gap:10px;margin:14px 0}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#e7eef7;font-size:12px;font-weight:700;flex:none}.bubble{background:#eef4fa;border-radius:16px;padding:13px 15px;line-height:1.55;max-width:80%}.message.user{justify-content:flex-end}.message.user .avatar{order:2}.message.user .bubble{background:#163b68;color:white}.meta{margin-top:9px;font-size:12px;opacity:.7}.suggestions{display:flex;gap:8px;flex-wrap:wrap;padding:14px 8px}.suggestions button{border:1px solid #d5dfeb;background:white;border-radius:999px;padding:9px 13px;cursor:pointer}.input-row{display:flex;gap:8px;border-top:1px solid #e7ebf0;padding-top:14px}.input-row input{flex:1;border:1px solid #cbd5e1;border-radius:12px;padding:13px;font-size:16px}.input-row button{border:0;border-radius:12px;padding:0 20px;background:#163b68;color:white;font-weight:700;cursor:pointer}footer{text-align:center;padding:18px;color:#667085;font-size:14px}footer a{color:#163b68;text-decoration:none;font-weight:700}@media(max-width:600px){.hero h1{font-size:28px}.bubble{max-width:88%}}
  </style>
</head>
<body>
<main class="app">
  <header class="hero">
    <div class="badge">🏛 대한민국 법원 등기정보광장</div>
    <h1>등기정보광장<br><span>AI 안내봇</span></h1>
    <p>등기현황·통계·데이터 활용·Open API 정보를 공식자료를 기준으로 안내합니다.</p>
  </header>
  <section class="chat" aria-label="안내봇">
    <div id="messages" class="messages">
      <div class="message bot"><div class="avatar">AI</div><div class="bubble">안녕하세요. 등기정보광장 AI 안내봇입니다.<br><br>질문을 입력하면 통계·현황 질문과 Open API·일반 안내 질문을 구분하여 처리합니다.<br><br><b>중요:</b> 최신 통계 수치는 AI가 임의로 생성하지 않고 공식 데이터 조회 결과를 기준으로 답변하도록 설계되어 있습니다.</div></div>
    </div>
    <div class="suggestions">
      <button data-q="2026년 9월 경매·공매등기 신청 현황은?">최근 경매·공매 현황</button>
      <button data-q="Open API는 어떻게 이용하나요?">Open API 이용방법</button>
      <button data-q="등기현황에서는 어떤 정보를 볼 수 있나요?">등기현황 안내</button>
      <button data-q="등기정보광장이 무엇인가요?">등기정보광장 소개</button>
    </div>
    <form id="questionForm" class="input-row">
      <input id="question" autocomplete="off" placeholder="질문을 입력하세요" aria-label="질문">
      <button type="submit">검색</button>
    </form>
  </section>
  <footer><a href="https://data.iros.go.kr/" target="_blank" rel="noopener">등기정보광장 바로가기 ↗</a> · 공식 공개자료 기반 안내</footer>
</main>
<script src="app.js"></script>
</body>
</html>
