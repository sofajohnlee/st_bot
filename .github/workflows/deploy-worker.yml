name: Deploy Registry Bot Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker.js'
      - 'public/**'
      - 'app.js'
      - 'index.html'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate
        run: npm test

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
